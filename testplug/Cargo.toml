[package]
name = "oap-testplug"
version.workspace = true
edition = "2021"
description = "Test CLAP effect for the OpenAudioPower plug-in host (gain, simple editor, state, deliberate crash)"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clap-sys = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }
