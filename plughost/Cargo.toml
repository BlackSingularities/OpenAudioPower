[package]
name = "oap-plughost"
version.workspace = true
edition = "2021"
description = "OpenAudioPower plug-in host: runs one VST3 or CLAP plug-in in its own process"
license = "GPL-3.0-or-later"
authors = ["redzikowski.com"]

[[bin]]
name = "oap-plughost"
path = "src/main.rs"

[dependencies]
vst3-host = { version = "0.11", default-features = false }
clap-sys = "0.5"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Security"] }
