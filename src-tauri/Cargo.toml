[package]
name = "openaudiopower"
version.workspace = true
edition = "2021"
description = "OpenAudioPower - audio recording, editing and stem separation studio"
license = "GPL-3.0-or-later"
authors = ["redzikowski.com"]

[lib]
name = "openaudiopower_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openaudiopower-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
parking_lot = "0.12"
rayon = "1.10"
sys-locale = "0.3"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security"] }
