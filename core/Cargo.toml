[package]
name = "openaudiopower-core"
version.workspace = true
edition = "2021"
description = "OpenAudioPower audio engine: decoding, DSP, analysis, mixing and stem separation"
license = "GPL-3.0-or-later"
authors = ["redzikowski.com"]

[features]
default = ["neural"]
neural = ["dep:ort"]

[dependencies]
symphonia = { version = "0.5.5", features = ["all"] }
rubato = "0.16"
realfft = "3.5"
rustfft = "6.4"
hound = "3.5"
flacenc = "0.5"
ebur128 = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
ureq = "2.12"
ort = { version = "=2.0.0-rc.10", optional = true, features = ["directml"] }
